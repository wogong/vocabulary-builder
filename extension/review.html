<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>已收集的词</title>
    <style>
      body {
        font: 14px/1.6 -apple-system, "Segoe UI", "Noto Sans CJK SC", sans-serif;
        max-width: 860px;
        margin: 32px auto;
        padding: 0 20px;
        color: #222;
      }
      h1 { font-size: 18px; margin-bottom: 4px; }
      .hint { color: #777; font-size: 12px; margin: 2px 0 16px; }
      .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
      input[type="search"] {
        flex: 1; padding: 7px 9px; border: 1px solid #ccc; border-radius: 5px; font: inherit;
      }
      button {
        padding: 7px 14px; border-radius: 5px; border: 1px solid #ccc;
        background: #f7f7f7; font: inherit; cursor: pointer;
      }
      button:disabled { opacity: .5; cursor: default; }
      button.danger { border-color: #d9b0b0; color: #b71c1c; }
      #status { font-size: 13px; min-height: 20px; }
      .ok { color: #1b5e20; }
      .error { color: #b71c1c; }
      ul { list-style: none; padding: 0; margin: 12px 0 0; }
      li {
        border-top: 1px solid #eee; padding: 12px 0;
        display: flex; gap: 14px; align-items: baseline;
      }
      li.gone { opacity: .45; }
      .word { font-weight: 600; min-width: 140px; word-break: break-word; }
      .word small { display: block; font-weight: 400; color: #888; font-size: 11px; }
      .body { flex: 1; min-width: 0; }
      .sentence { word-break: break-word; }
      .sentence b { background: #fff3c4; font-weight: 600; }
      .meta { color: #888; font-size: 12px; margin-top: 3px; }
      .meta a { color: #888; }
      .tag { font-size: 11px; border: 1px solid #ddd; border-radius: 3px; padding: 0 4px; }
    </style>
  </head>
  <body>
    <h1>已收集的词</h1>
    <p class="hint">
      删除会同时移除 Anki 卡片上的这条语境和服务端的采集记录。
      一个词有多条语境时，删掉最后一条才会删除整张卡。
    </p>

    <div class="bar">
      <input id="q" type="search" placeholder="按词搜索，回车确认" />
      <button id="refresh">刷新</button>
    </div>
    <p id="status"></p>

    <ul id="list"></ul>

    <script src="review.js"></script>
  </body>
</html>
